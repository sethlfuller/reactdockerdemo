name: Dev Image Build and Deploy

on:
  workflow_dispatch:

env:
  # IMAGE_REPOSITORY: 'baincommercialdashboard'
  # CONTAINER_REGISTRY: 'bcdregistrydev.azurecr.io'
  DOCKERFILE_PATH: 'myApp/frontend/Dockerfile'
  RESOURCE_GROUP: 'bcddev-resource-group'
  APP_NAME: 'bcd-web-app-dev'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
        username: ${{ secrets.AZURE_SP_USERNAME }}
        password: ${{ secrets.AZURE_SP_PASSWORD }}

    - name: Build and push image to ACR
      run: |
        docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.AZURE_IMAGE_REPOSITORY }}:${{ github.run_number }} -f ${{ env.DOCKERFILE_PATH }} .
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.AZURE_IMAGE_REPOSITORY }}:${{ github.run_number }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Dev

    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.APP_NAME }}
        images: '${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.AZURE_IMAGE_REPOSITORY }}:${{ github.run_number }}'
